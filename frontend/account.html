<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Акаунт — STEM Diagnostic</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="header-top">
            <div class="container header-inner">
                <a href="index.html" class="logo" aria-label="STEM Diagnostic"><span class="logo-icon" aria-hidden="true">S</span><span class="logo-word">TEM Diagnostic</span></a>
                <nav class="nav">
                    <a href="dashboard.html">Панель</a>
                    <a href="account.html">Акаунт</a>
                    <a href="contact.html">Контакти</a>
                    <a href="#" id="logoutBtn" class="btn btn-ghost">Вийти</a>
                </nav>
                <button class="mobile-toggle" aria-label="Меню">☰</button>
            </div>
        </div>
    </header>
    <main class="container" style="padding-top: 6rem;">
        <div class="card">
            <h1 class="page-title">Зміна пароля</h1>
            <p style="margin-bottom:1rem;color:var(--text-light)">Пароль для входу в STEM Diagnostic (не плутати з паролем PostgreSQL).</p>
            <form id="pwdForm">
                <div class="form-group">
                    <label for="current">Поточний пароль</label>
                    <input type="password" id="current" required autocomplete="current-password">
                </div>
                <div class="form-group">
                    <label for="new1">Новий пароль (мін. 8 символів)</label>
                    <input type="password" id="new1" required minlength="8" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="new2">Повтор нового пароля</label>
                    <input type="password" id="new2" required minlength="8" autocomplete="new-password">
                </div>
                <div id="msg" class="form-error" style="display:none" role="alert"></div>
                <div id="ok" style="display:none;color:var(--success);margin-bottom:0.5rem">Пароль змінено.</div>
                <button type="submit" class="btn btn-accent" style="width:100%">Зберегти</button>
            </form>
        </div>
    </main>
    <script src="app.js"></script>
    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';
        document.getElementById('logoutBtn').addEventListener('click', (e) => {
            e.preventDefault();
            if (window.clearAuthToken) window.clearAuthToken();
            else localStorage.removeItem('token');
            window.location.href = 'index.html';
        });
        document.getElementById('pwdForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const n1 = document.getElementById('new1').value;
            const n2 = document.getElementById('new2').value;
            const msg = document.getElementById('msg');
            const ok = document.getElementById('ok');
            msg.style.display = 'none';
            ok.style.display = 'none';
            if (n1 !== n2) {
                msg.textContent = 'Нові паролі не збігаються';
                msg.style.display = 'block';
                return;
            }
            let res;
            let data;
            try {
                res = await fetch((window.API_BASE || '') + '/api/auth/change-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({
                        current_password: document.getElementById('current').value,
                        new_password: n1
                    })
                });
                data = await res.json().catch(() => ({}));
            } catch (err) {
                msg.textContent = window.formatFetchError ? window.formatFetchError(err) : 'Помилка мережі';
                msg.style.display = 'block';
                return;
            }
            if (!res.ok) {
                msg.textContent = window.translateApiDetail ? window.translateApiDetail(data.detail) : (data.detail || 'Помилка');
                msg.style.display = 'block';
                return;
            }
            ok.style.display = 'block';
            document.getElementById('pwdForm').reset();
        });
    </script>
    <script>document.querySelector('.mobile-toggle')?.addEventListener('click',()=>document.querySelector('.nav').classList.toggle('open'));</script>
</body>
</html>
