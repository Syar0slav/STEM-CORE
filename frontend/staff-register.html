<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація персоналу — STEM Diagnostic</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="header-top">
            <div class="container header-inner">
                <a href="index.html" class="logo" aria-label="STEM Diagnostic"><span class="logo-icon" aria-hidden="true">S</span><span class="logo-word">TEM Diagnostic</span></a>
                <nav class="nav">
                    <a href="index.html">Головна</a>
                    <a href="register.html" class="stem-auth-register">Реєстрація</a>
                    <a href="login.html" class="btn btn-accent stem-auth-login">Увійти</a>
                </nav>
                <button class="mobile-toggle" aria-label="Меню">☰</button>
            </div>
        </div>
    </header>
    <main class="container" style="padding-top: 6rem;">
        <div class="card">
            <h1 class="page-title">Реєстрація персоналу</h1>
            <p style="margin-bottom:1rem;color:var(--text-light)">Потрібен код запрошення (налаштовується на сервері, <code>STAFF_INVITE_SECRET</code>).</p>
            <form id="staffForm">
                <div class="form-group">
                    <label for="invite">Код запрошення *</label>
                    <input type="password" id="invite" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="role">Роль *</label>
                    <select id="role" required style="width:100%;padding:0.75rem;border:1px solid var(--border);border-radius:0.5rem">
                        <option value="teacher">Вчитель</option>
                        <option value="deputy">Завуч</option>
                        <option value="director">Директор</option>
                    </select>
                </div>
                <div class="form-group" id="deputyParallelWrap" style="display:none">
                    <label for="deputyParallel">Паралель завуча *</label>
                    <select id="deputyParallel" style="width:100%;padding:0.75rem;border:1px solid var(--border);border-radius:0.5rem">
                        <option value="A">А (класи А1–А11)</option>
                        <option value="B">Б (класи Б1–Б11)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="schoolId">ID школи (UUID, опційно)</label>
                    <input type="text" id="schoolId" placeholder="a1000000-0000-0000-0000-000000000001">
                </div>
                <div class="form-group">
                    <label for="fullName">ПІБ</label>
                    <input type="text" id="fullName" autocomplete="name">
                </div>
                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="text" id="email" required autocomplete="email" inputmode="email" spellcheck="false" placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label for="password">Пароль *</label>
                    <div class="password-field-wrap">
                        <input type="password" id="password" required minlength="8" autocomplete="new-password">
                        <button type="button" class="password-toggle" id="toggleStaffPassword">Показати</button>
                    </div>
                </div>
                <div id="formError" class="form-error" style="display:none" role="alert"></div>
                <button type="submit" class="btn btn-accent" style="width:100%">Зареєструватися</button>
            </form>
        </div>
    </main>
    <script src="app.js"></script>
    <script>
        if (window.stemRedirectIfLoggedIn) window.stemRedirectIfLoggedIn();
        if (window.wirePasswordToggle) {
            window.wirePasswordToggle(document.getElementById('toggleStaffPassword'), document.getElementById('password'));
        }
        document.getElementById('staffForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errEl = document.getElementById('formError');
            errEl.style.display = 'none';
            const sid = document.getElementById('schoolId').value.trim();
            const body = {
                invite_secret: document.getElementById('invite').value,
                role: document.getElementById('role').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                full_name: document.getElementById('fullName').value
            };
            if (sid) body.school_id = sid;
            if (body.role === 'deputy') {
                body.deputy_parallel = document.getElementById('deputyParallel').value;
            }
            let res;
            let data;
            try {
                res = await fetch((window.API_BASE || '') + '/api/auth/register-staff', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                data = await res.json().catch(() => ({}));
            } catch (err) {
                errEl.textContent = window.formatFetchError ? window.formatFetchError(err) : 'Помилка мережі';
                errEl.style.display = 'block';
                return;
            }
            if (!res.ok) {
                errEl.textContent = window.translateApiDetail ? window.translateApiDetail(data.detail) : (data.detail || 'Помилка');
                errEl.style.display = 'block';
                return;
            }
            if (window.setAuthToken) window.setAuthToken(data.access_token);
            else localStorage.setItem('token', data.access_token);
            window.location.href = 'dashboard.html';
        });
    </script>
    <script>document.querySelector('.mobile-toggle')?.addEventListener('click',()=>document.querySelector('.nav').classList.toggle('open'));</script>
</body>
</html>
